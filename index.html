/* ===== leitor de notas: texto (OCR) → dados ===== */
const NOTA_UN={UN:'un',UND:'un',UNID:'un',PC:'un',PCT:'pct',KG:'kg',G:'g',GR:'g',L:'L',LT:'L',LTS:'L',ML:'ml',CX:'cx',CXA:'cx',FD:'fd',FDO:'fd',FARDO:'fd',GF:'gf',GFA:'gf',PT:'pct',SC:'sc',DZ:'dz',EN:'eng',ENG:'eng',BD:'un',BJ:'un',LA:'un',LATA:'un',GR:'g'};
const numBR=t=>{t=String(t).replace(/[^\d.,-]/g,'');if(t.includes(','))t=t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');return parseFloat(t)||0};
function lerTextoNota(txt){
  const T=txt.replace(/\r/g,'').replace(/[|]/g,' ').replace(/[ \t]+/g,' ');
  const linhas=T.split('\n').map(l=>l.trim()).filter(Boolean);
  const U=T.toUpperCase();
  const R={itens:[],total:0,data:'',hora:'',cnpj:'',emitente:'',pagamento:'',chave:'',tipo:'compra',combustivel:null,placa:'',odometro:0};
  // data
  const dm=U.match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}:\d{2}))?/);if(dm){R.data=`${dm[3]}-${dm[2]}-${dm[1]}`;R.hora=dm[4]||''}
  else{const d2=U.match(/(\d{2})\/(\d{2})\/(\d{2})\b/);if(d2)R.data=`20${d2[3]}-${d2[2]}-${d2[1]}`}
  // cnpj
  const cn=U.replace(/\s*([.\/-])\s*/g,'$1').match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/);if(cn)R.cnpj=cn[0];
  // emitente: primeira linha "com letras" antes do CNPJ
  {let best=0;for(const l of linhas.slice(0,12)){if(/CNPJ/i.test(l))break;
    const sem=l.replace(/\s/g,''),letras=(l.match(/[A-Za-zÀ-ú]/g)||[]).length,pal=(l.match(/[A-Za-zÀ-ú]{2,}/g)||[]);
    if(!sem.length||/^(DOCUMENTO|NFC|CUPOM|DANFE|CONSULTE)/i.test(l))continue;
    let sc=letras/sem.length*2+Math.min(pal.length,5)*.3-(pal.filter(w=>w.length<=2).length*.4);
    if(/LTDA|EIRELI|\bME\b|S\/?A\b|SUPERMERCADO|MERCADO|POSTO|DISTRIBUIDORA|ATACAD|COMERCIO|COM[EÉ]RCIO|HORTI|A[CÇ]OUGUE|PADARIA|CEASA|BEBIDAS/i.test(l))sc+=2;
    if(sc>best&&letras>=6&&letras/sem.length>.75){best=sc;R.emitente=l.replace(/\s{2,}/g,' ').trim()}}}
  // chave de acesso (44 dígitos, pode vir quebrada em 2 linhas)
  const dig=U.replace(/(\d{4}) ?\n ?(\d{4})/g,'$1 $2').match(/(\d{4}\s?){10}\d{4}/);if(dig)R.chave=dig[0].replace(/\s/g,'');
  // total
  const tots=[];const reT=/(VALOR\s*A\s*PAGAR|VALOR\s*TOTAL|TOTAL\s*(?:A\s*PAGAR|GERAL|R\$)|^TOTAL)[^\d\n]{0,20}(\d{1,3}(?:\.\d{3})*,\d{2})/gm;let m;
  while((m=reT.exec(U)))tots.push([/PAGAR/.test(m[1])?2:1,numBR(m[2])]);
  if(tots.length){tots.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);R.total=tots[0][1]}
  // pagamento
  const pg=[['Pix',/\bPIX\b/],['Crédito',/CR[EÉ]DITO/],['Débito',/D[EÉ]BITO/],['Dinheiro',/DINHEIRO|ESP[EÉ]CIE/],['Boleto',/BOLETO/]].find(([,r])=>r.test(U));if(pg)R.pagamento=pg[0];
  // placa / odômetro (posto)
  const pl=U.match(/PLACA[:\s]*([A-Z]{3}-?\d[A-Z0-9]\d{2})/);if(pl)R.placa=pl[1];
  const od=U.match(/(?:ODOMETRO|ODÔMETRO|KM\s*ATUAL|HODOMETRO)[:\s]*(\d{3,7})/);if(od)R.odometro=+od[1];
  // itens: "... QTD UN X VLUNIT VLTOTAL"
  const reI=/(\d+(?:[.,]\d{1,3})?)\s*([A-Z]{1,5})?\s*[Xx×*]{1,3}\s*(\d{1,3}(?:\.\d{3})*[.,]\d{2,3})\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
  const ruido=/^(QTD|VALOR|TOTAL|DESCONTO|ACR[EÉ]SCIMO|TROCO|FORMA|CODIGO|C[OÓ]D|ITEM|#)/i;
  linhas.forEach((l,i)=>{
    const L=l.replace(/(\d)([Xx×])(?=\s*\d)/g,'$1 $2').replace(/(\d[.,]?\d*\s+[A-Za-z]{1,4})[Xx](?=\s+\d)/g,'$1 X');

    let desc=L.slice(0,mm.index).trim();
    if(desc.replace(/[^A-Za-zÀ-ú]/g,'').length<3&&i>0)desc=linhas[i-1];
    desc=desc.replace(/^\s*#?\d{1,3}\s+/,'').replace(/^\d{4,14}\s+/,'').replace(/^\d{1,3}\s+\d{4,14}\s+/,'').replace(/\s{2,}/g,' ').trim();
    const qtd=numBR(mm[1]),un=(mm[2]||'UN').toUpperCase(),vUnit=numBR(mm[3]),vTot=numBR(mm[4]);
    if(!qtd||!vTot)return;
    R.itens.push({desc,qtd,un:NOTA_UN[un]||un.toLowerCase(),unOrig:un,vUnit,vTot});
  });
  // combustível
  const comb=R.itens.find(it=>/GASOLINA|ETANOL|ALCOOL|ÁLCOOL|DIESEL|GNV|S10|S500/i.test(it.desc));
  if(comb||/AUTO\s*POSTO|POSTO\s|COMBUST/i.test(U)&&!R.itens.some(it=>!/GASOLINA|ETANOL|DIESEL|ALCOOL|GNV|ARLA|OLEO\s*MOTOR/i.test(it.desc))){
    R.tipo='combustivel';const c=comb||R.itens[0];
    R.combustivel={produto:c?c.desc:'Combustível',litros:c&&/L/.test(c.un)?c.qtd:(c?c.qtd:0),precoL:c?c.vUnit:0,valor:c?c.vTot:R.total};
  }
  if(!R.total&&R.itens.length)R.total=R.itens.reduce((s,x)=>s+x.vTot,0);
  if(!R.itens.length&&R.total&&R.tipo!=='combustivel')R.tipo='despesa';
  return R;
}
/* XML da NF-e / NFC-e (o arquivo que o fornecedor manda por e-mail) */
function lerXmlNota(xml){
  const d=new DOMParser().parseFromString(xml,'text/xml');
  const g=(el,tag)=>{const x=el.getElementsByTagName(tag)[0];return x?x.textContent.trim():''};
  const inf=d.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não é um XML de NF-e');
  const ide=inf.getElementsByTagName('ide')[0],emit=inf.getElementsByTagName('emit')[0];
  const dh=g(ide,'dhEmi')||g(ide,'dEmi');
  const TP={'01':'Dinheiro','02':'Cheque','03':'Crédito','04':'Débito','05':'Crédito loja','15':'Boleto','16':'Depósito','17':'Pix','18':'Transferência','90':'Sem pagamento','99':'Outros'};
  const R={itens:[],total:+g(inf,'vNF')||0,data:dh.slice(0,10),hora:dh.slice(11,16),cnpj:g(emit,'CNPJ'),emitente:g(emit,'xFant')||g(emit,'xNome'),pagamento:TP[g(inf,'tPag')]||'',chave:(inf.getAttribute('Id')||'').replace(/^NFe/,''),tipo:'compra',combustivel:null,xml:true,frete:+g(inf.getElementsByTagName('ICMSTot')[0]||inf,'vFrete')||0};
  [...inf.getElementsByTagName('det')].forEach(det=>{const p=det.getElementsByTagName('prod')[0];
    const un=g(p,'uCom').toUpperCase();
    R.itens.push({desc:g(p,'xProd'),ean:g(p,'cEAN').replace(/\D/g,''),qtd:+g(p,'qCom'),un:NOTA_UN[un]||un.toLowerCase(),unOrig:un,vUnit:+g(p,'vUnCom'),vTot:+g(p,'vProd')-(+g(p,'vDesc')||0)})});
  const comb=R.itens.find(it=>/GASOLINA|ETANOL|ALCOOL|DIESEL|GNV/i.test(it.desc));
  if(comb){R.tipo='combustivel';R.combustivel={produto:comb.desc,litros:comb.qtd,precoL:comb.vUnit,valor:comb.vTot}}
  return R;
}

const IDB={_db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{try{const r=indexedDB.open('bdb-anexos',1);r.onupgradeneeded=()=>r.result.createObjectStore('a');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async tx(modo,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('a',modo);const st=t.objectStore('a');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',st=>st.put(v,k))},
  get(k){return this.tx('readonly',st=>st.get(k))},
  del(k){return this.tx('readwrite',st=>st.delete(k))},
  async tudo(){const ks=await this.tx('readonly',st=>st.getAllKeys());const vs=await this.tx('readonly',st=>st.getAll());const o={};(ks||[]).forEach((k,i)=>o[k]=vs[i]);return o}
};

async function lancarNota(){
  const n=UI.nt,NR=n.R,total=num(n.total);
  const dado=n.anexo?(n.anexo.img||n.anexo.xml):null;
  const meta={data:n.data,emitente:n.emitente,total,chave:NR.chave||'',qr:NR.qr||'',cnpj:NR.cnpj||''};
  const comum={pagamento:n.pagamento,pagoPor:n.pagoPor||'',reembolsado:false,por:nomeAtual()};
  if(n.tipo==='compra'){
    const est=n.linhas.filter(l=>l.destino==='estoque'&&l.itemId&&num(l.qtd)>0);
    if(!est.length&&!n.linhas.some(l=>l.destino==='despesa')){toast('Escolha pelo menos um item do estoque, ou mude para "Outra despesa"','bad');return}
    if(n.linhas.some(l=>l.destino==='estoque'&&!l.itemId)){toast('Tem item marcado para o estoque sem escolher qual','bad');return}
    const nid=dado?await guardarAnexo(dado,Object.assign({tipo:'compra'},meta)):null;
    let cid=null;
    if(est.length){
      const itens=est.map(l=>{const x=itemById(l.itemId);return{itemId:l.itemId,qtd:l.modo==='emb'?num(l.qtd):qtdEmUnidade(l,x),modo:l.modo,valor:num(l.vTot)}});
      const c=Object.assign({data:n.data,local:n.local,fornecedor:n.emitente,obs:'Lançada pela nota'+(NR.xml?' (XML)':''),ratear:false,itens,desl:[],notaId:nid},comum);
      salvarCompra(c);cid=c.id;
      est.forEach(l=>{S.mapaNotas[chaveNota(l)]={itemId:l.itemId,modo:l.modo}});
    }
    const resto=sum(n.linhas.filter(l=>l.destino==='despesa'),'vTot');
    if(resto>0)S.despesas.push(Object.assign({id:uid(),data:n.data,cat:n.catResto,desc:n.emitente+': '+n.linhas.filter(l=>l.destino==='despesa').map(l=>l.desc).join(', ').slice(0,120),valor:r2(resto),km:0,local:n.local,notaId:nid,compraNota:cid||''},comum));
    if(nid){const m=S.notas.find(x=>x.id===nid);m.ref=cid||'';}
    registrar('nota',`Lançou nota de ${n.emitente||n.local} · ${R2txt(total)}`,nomeAtual());
  }else if(n.tipo==='comb'){
    const valor=num(n.comb.valor)||total;if(!valor){toast('Informe o valor','bad');return}
    const nid=dado?await guardarAnexo(dado,Object.assign({tipo:'despesa'},meta)):null;
    const lt=num(n.comb.litros),pl=num(n.comb.precoL);
    S.despesas.push(Object.assign({id:uid(),data:n.data,cat:'Combustível',desc:`${n.comb.produto||'Combustível'}${lt?' · '+N(lt,2)+' L':''}${pl?' a '+R(pl)+'/L':''} — ${n.emitente||'posto'}${n.destino?' (ida ao '+n.destino+')':''}`,valor,km:num(n.km),local:n.destino,litros:lt,precoL:pl,notaId:nid},comum));
    registrar('nota',`Lançou abastecimento ${R2txt(valor)} · ${n.emitente||'posto'}`,nomeAtual());
  }else{
    if(!total){toast('Informe o total','bad');return}
    const nid=dado?await guardarAnexo(dado,Object.assign({tipo:'despesa'},meta)):null;
    S.despesas.push(Object.assign({id:uid(),data:n.data,cat:n.cat,desc:n.desc||n.emitente||n.cat,valor:total,km:0,local:'',notaId:nid},comum));
    registrar('nota',`Lançou despesa ${R2txt(total)} · ${n.desc||n.emitente}`,nomeAtual());
  }
  save();popModal(true);render();toast('✅ Nota lançada'+(dado?' com comprovante anexado':''));
}

async function salvarMov(){

async function salvarSocio(id){
  const x=id?S.socios.find(z=>z.id===id):null;
  const nome=$('#sN').value.trim(),papel=$('#sR').value,cota=num($('#sC').value),p1=$('#sP').value,p2=$('#sP2').value;
  if(!nome){toast('Informe o nome','bad');return}
  if(!x||p1){if(p1.length<4){toast('A senha precisa ter pelo menos 4 caracteres','bad');return}
    if(p1!==p2){toast('As senhas não conferem','bad');return}
    if(S.socios.some(z=>z.id!==id&&z.hash===hashS(p1))){toast('Essa senha já é de outra pessoa — escolha outra','bad');return}}
  if(x&&ehSocio(x)&&!ehAdmin(x)&&papel!=='socio'&&socios().length===1){toast('Precisa ficar pelo menos um sócio','bad');return}
  if(x&&ehAdmin(x)&&!ehAdmin(usuarioAtual())){toast('Só o próprio administrador altera essa conta','bad');return}
  if(papel==='admin'&&S.socios.some(z=>ehAdmin(z)&&z.id!==id)&&!ehAdmin(usuarioAtual())){toast('Só um administrador pode criar outro','bad');return}
  const q=await autoriza('config',x?`Salvar as alterações de ${nome}?`:`Cadastrar ${nome} como ${papel==='socio'?'sócio':papel==='admin'?'administrador do sistema':'funcionário'}?`,'Salvar',true);if(!q)return;
  if(x){Object.assign(x,{nome,papel,cota:papel==='socio'?cota:null});if(p1)x.hash=hashS(p1);registrar('config',`Alterou o usuário ${nome}${p1?' (senha nova)':''}`,q)}
  else{S.socios.push({id:uid(),nome,papel,cota:papel==='socio'?cota:null,hash:hashS(p1),criado:Date.now()});registrar('config',`Cadastrou ${papel==='socio'?'o sócio':papel==='admin'?'o administrador':'o funcionário'} ${nome}`,q)}
  save();popModal(true);render();toast(x?'Usuário atualizado':'👤 Usuário cadastrado');
}
async function removerSocio(id){
  const x=S.socios.find(z=>z.id===id);
  if(x.id===UI.user){toast('Você não pode remover a si mesmo','bad');return}
  if(ehSocio(x)&&!ehAdmin(x)&&socios().length===1){toast('Precisa ficar pelo menos um sócio','bad');return}
  if(ehAdmin(x)&&!ehAdmin(usuarioAtual())){toast('Só o administrador remove essa conta','bad');return}
  const q=await autoriza('config',`Remover o acesso de ${x.nome}? O histórico do que ele lançou continua.`,'Remover');if(!q)return;
  S.socios=S.socios.filter(z=>z.id!==id);registrar('config','Removeu o acesso de '+x.nome,q);save();render();
}

/* cria (ou completa) estoque e cardápio do Bar do Batista. precos: true = preço de exemplo, false = sem preço */
function instalarCardapioBatista(precos){
  const K={};
  ESTOQUE_BATISTA.forEach(([k,nome,cat,un,emb,eq,min])=>{let it=S.itens.find(i=>i.nome.toLowerCase()===nome.toLowerCase());if(!it){it={id:uid(),nome,cat,un,emb,embQtd:eq,min,estoque:0,custo:0};S.itens.push(it)}K[k]=it.id});
  let novos=0;
  CARDAPIO_BATISTA.forEach(([cat,nome,preco,foto='',ficha=[],desc='',dia='',adic=[]])=>{
    if(S.cardapio.some(p=>p.nome.toLowerCase()===nome.toLowerCase()))return;
    const ehEsc=adic==='ESC_ESPETOS';
    const adicionais=ehEsc?[]:adic.map(([n,p,k,q])=>({nome:n,preco:p,itemId:k?K[k]:'',qtd:q}));
    const escolha=ehEsc?{nome:'espetos',nomeSing:'espeto',nomePlural:'espetos',max:2,precos:precos?[25,32]:[0,0],opcoes:ESPETOS_OP.map(([n,k])=>({nome:n,itemId:k?K[k]:'',qtd:1}))}:undefined;
    if(ehEsc&&S.cardapio.some(p=>p.escolha&&/combinado/i.test(p.nome)))return;
    const novo={id:uid(),nome,cat,preco:precos?preco:0,precoExemplo:!!precos,foto,desc,dia,comp:ficha.map(([k,q])=>({itemId:K[k],qtd:q})),adicionais,ativo:true};if(escolha)novo.escolha=escolha;
    S.cardapio.push(novo);novos++});
  S.menuBatista=4;return{K,novos};
}

  let n=0;S.cardapio.forEach(p=>{const k=p.nome.toLowerCase();if(k in def&&(!p.foto||FOTOS[p.foto])&&p.foto!==def[k]){p.foto=def[k];n++}});

function unirCombinado(){
  /* junta "Combinado com 1 espeto" e "com 2 espetos" em um só, com escolha de 1 ou 2 */
  const cs=S.cardapio.filter(p=>/combinado da ro[cç]a/i.test(semAc(p.nome).replace('roca','roça'))||/combinado da ro/i.test(p.nome));
  if(!cs.length||cs.some(p=>p.escolha))return;
  const dois=cs.find(p=>/\b2\b|dois/i.test(p.nome)),um=cs.find(p=>p!==dois)||cs[0];
  const ops=[...(um.adicionais||[])].filter(a=>a.itemId||/carne|espeto/i.test(a.nome));
  um.escolha={nome:'espetos',nomeSing:'espeto',nomePlural:'espetos',max:2,precos:[+um.preco||0,dois&&dois!==um?+dois.preco||0:r2((+um.preco||0)+7)],opcoes:(ops.length?ops:ESPETOS_OP.map(([n])=>({nome:n}))).map(a=>({nome:a.nome,itemId:a.itemId||(S.itens.find(i=>semAc(i.nome)===semAc(a.nome))||{}).id||'',qtd:1}))};
  um.adicionais=(um.adicionais||[]).filter(a=>!ops.includes(a));
  um.nome='Combinado da Roça';um.desc='Arroz, feijão, vinagrete, farofa e mandioca cozida. Com 1 ou 2 espetos à escolha (ou carne cozida).';
  if(dois&&dois!==um)S.cardapio=S.cardapio.filter(p=>p!==dois);
  setTimeout(()=>toast('🍢 Combinado da Roça agora é um produto só: escolha 1 ou 2 espetos'),400);
}

function nvDiff(){
  const out=lsGet(NV_K.out,{});let n=0;
  for(const k of NV_COLS){const arr=Array.isArray(S[k])?S[k]:[];const sm=NV.sombra[k]||(NV.sombra[k]=new Map());const vistos=new Set();
    for(const x of arr){if(!x||typeof x!=='object')continue;if(!x.id)x.id=uid();if(x._o==null)x._o=nvOrd();if(vistos.has(x.id))continue;vistos.add(x.id);
      const j=JSON.stringify(x);if(sm.get(x.id)!==j){sm.set(x.id,j);out[k+'|'+x.id]='s'+(++NV.seq);n++}}
    for(const id of [...sm.keys()])if(!vistos.has(id)){sm.delete(id);out[k+'|'+id]='d'+(++NV.seq);n++}}
  const mj=JSON.stringify(nvMeta());if(mj!==NV.sombraMeta){NV.sombraMeta=mj;out.meta='s'+(++NV.seq);n++}
  if(n)lsSet(NV_K.out,out);return n;
}
function nvAgendar(){clearTimeout(NV.flushT);NV.flushT=setTimeout(nvFlush,350);nvStatus()}
async function nvFlush(){
  if(!NV.db||!NV.user||!NV.conectado||NV.carregando)return nvStatus();
  if(NV.flushing){NV.flushDeNovo=true;return}
  const out=lsGet(NV_K.out,{});const keys=Object.keys(out);if(!keys.length)return nvStatus();
  NV.flushing=true;nvStatus();
  const ts=firebase.firestore.FieldValue.serverTimestamp(),base=nvBase();
  try{
    for(let i=0;i<keys.length;i+=400){
      const b=NV.db.batch(),parte=keys.slice(i,i+400);
      for(const key of parte){
        if(key==='meta'){b.set(base,{j:JSON.stringify(nvMeta()),_t:ts});continue}
        const p=key.indexOf('|'),k=key.slice(0,p),id=key.slice(p+1),ref=base.collection(k).doc(id);
        const x=out[key][0]==='s'&&(S[k]||[]).find(y=>y&&y.id===id);
        b.set(ref,x?{j:JSON.stringify(x),_t:ts}:{d:true,_t:ts});
      }
      const pr=b.commit();
      if(!NV.persist)await pr;else pr.catch(nvErro);
      const agora=lsGet(NV_K.out,{});parte.forEach(k=>{if(agora[k]===out[k])delete agora[k]});lsSet(NV_K.out,agora);
    }
    NV.pendServer=true;NV.db.waitForPendingWrites().then(()=>{NV.pendServer=false;nvStatus()}).catch(()=>{});
  }catch(e){nvErro(e)}
  NV.flushing=false;nvStatus();
  if(NV.flushDeNovo){NV.flushDeNovo=false;nvAgendar()}
}

/* ouvir mudanças feitas nos outros aparelhos */
function nvOuvir(){
  try{ouvirPedidos();publicarCardapio();devOuvir()}catch(e){console.warn(e)}
  NV.unsubs.forEach(u=>{try{u()}catch(e){}});NV.unsubs=[];
  const base=nvBase(),wm=lsGet(NV_K.wm,{}),prontos=[];
  for(const k of NV_COLS){
    const desde=firebase.firestore.Timestamp.fromMillis(Math.max(1,(wm[k]||0)-120000));
    prontos.push(new Promise(res=>{let pri=true;
      NV.unsubs.push(base.collection(k).where('_t','>',desde).onSnapshot(snap=>{nvAplicar(k,snap.docChanges());if(pri){pri=false;res()}},e=>{nvErro(e);if(pri){pri=false;res()}}))}));
  }
  prontos.push(new Promise(res=>{let pri=true;NV.unsubs.push(base.onSnapshot(d=>{nvAplicarMeta(d);if(pri){pri=false;res()}},e=>{nvErro(e);if(pri){pri=false;res()}}))}));
  return Promise.all(prontos);
}
function nvAplicar(k,changes){
  const out=lsGet(NV_K.out,{}),wm=lsGet(NV_K.wm,{});let mx=wm[k]||0,mud=0;
  const sm=NV.sombra[k]||(NV.sombra[k]=new Map());if(!Array.isArray(S[k]))S[k]=[];const arr=S[k];
  for(const ch of changes){
    if(ch.type==='removed')continue;
    const doc=ch.doc,id=doc.id,d=doc.data({serverTimestamps:'estimate'});
    const t=d._t&&d._t.toMillis?d._t.toMillis():0;if(!doc.metadata.hasPendingWrites&&t>mx)mx=t;
    if(out[k+'|'+id])continue;
    const i=arr.findIndex(x=>x&&x.id===id);
    if(d.d){if(i>=0){arr.splice(i,1);mud++}sm.delete(id);continue}
    if(typeof d.j!=='string')continue;
    if(sm.get(id)===d.j&&i>=0)continue;
    let obj;try{obj=JSON.parse(d.j)}catch(e){continue}
    sm.set(id,JSON.stringify(obj));
    if(i>=0){const cur=arr[i];Object.keys(cur).forEach(kk=>delete cur[kk]);Object.assign(cur,obj)}
    else{let p=arr.length;while(p>0&&((arr[p-1]&&arr[p-1]._o)||0)>(obj._o||0))p--;arr.splice(p,0,obj)}
    mud++;
  }
  if(mx!==(wm[k]||0)){wm[k]=mx;lsSet(NV_K.wm,wm)}
  if(mud)nvMudouRemoto();
}
function nvAplicarMeta(doc){
  if(!doc.exists)return;const d=doc.data({serverTimestamps:'estimate'});
  if(lsGet(NV_K.out,{}).meta||typeof d.j!=='string')return;
  if(d.j===JSON.stringify(nvMeta()))return;
  let m;try{m=JSON.parse(d.j)}catch(e){return}
  const tema=S.config.tema;
  for(const k in m){if(NV_COLS.includes(k))continue;if(k==='config')S.config=Object.assign(blank().config,m.config,{tema});else S[k]=m[k]}
  NV.sombraMeta=JSON.stringify(nvMeta());nvMudouRemoto();
}

async function nvConectar(){
  NV.conectado=true;

  catch(e){NV.conectado=false;nvErro(e);nvTela(e&&e.code==='permission-denied'?'A nuvem recusou o acesso':'Não consegui falar com a nuvem',
    `<p class="lg-frase">${e&&e.code==='permission-denied'?'Confira se as Regras do Firestore foram publicadas.':'Confira a internet e tente de novo.'}</p><button class="btn p lg-btn" onclick="nvConectar()">Tentar de novo</button>`);return}
  if(!snap.exists){
    /* nuvem vazia: este aparelho é o primeiro e manda tudo que já tem */
    lsSet(NV_K.wm,{});lsSet(NV_K.out,{});NV.sombra={};NV.sombraMeta=null;

    lsSet(NV_K.wm,{});lsSet(NV_K.out,{});NV.sombra={};NV.sombraMeta=null;

  });
}

/* ============ caderninho do fiado ============ */
const cliById=id=>(S.clientes||[]).find(c=>c.id===id);
function fiadoLanc(cid){ // tudo que o cliente pendurou (vendas fechadas e mesas abertas)
  const L=[];
  S.vendas.forEach(v=>(v.pagamentos||[]).forEach(p=>{if(p.forma==='Fiado'&&p.clienteId===cid)L.push({tipo:'fiado',id:p.id,valor:p.valor,data:v.data,ts:p.ts||v.ts,label:v.label,itens:v.itens,vendaId:v.id})}));
  S.abertas.forEach(c=>(c.pagamentos||[]).forEach(p=>{if(p.forma==='Fiado'&&p.clienteId===cid)L.push({tipo:'fiado',id:p.id,valor:p.valor,data:iso(p.ts),ts:p.ts,label:labelC(c)+' (aberta)',itens:c.itens,aberta:true})}));
  return L;
}
const fiadoPagos=cid=>(S.fiadoPg||[]).filter(p=>p.clienteId===cid);
function saldoCli(cid){return r2(sum(fiadoLanc(cid),x=>x.valor)-sum(fiadoPagos(cid),x=>x.valor))}
function desdeCli(cid){ // data do fiado mais antigo ainda não pago (pagamentos abatem os mais antigos primeiro)
  let pago=sum(fiadoPagos(cid),x=>x.valor);
  for(const f of fiadoLanc(cid).sort((a,b)=>a.ts-b.ts)){if(pago>=f.valor-0.009){pago-=f.valor;continue}return f.ts}
  return null;
}
function fiadoSemNome(){let t=0;S.vendas.forEach(v=>(v.pagamentos||[]).forEach(p=>{if(p.forma==='Fiado'&&!p.clienteId)t+=p.valor}));return r2(t)}
const totalFiado=()=>r2(sum(S.clientes||[],c=>Math.max(0,saldoCli(c.id))));
const diasDesde=ts=>Math.floor((Date.now()-ts)/864e5);
function foneWa(f){const d=String(f||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');return d.length>=10?'55'+d:''}

function cardapioPublico(){

    const f=FOTOS[p.foto]?p.foto:(p.foto&&p.foto.startsWith('data:')&&p.foto.length<950000?'@':'');
    const r={id:p.id,nome:p.nome,cat:p.cat||'Outros',preco:+p.preco,desc:p.desc||'',foto:f,dia:p.dia||''};
    if(p.adicionais&&p.adicionais.length)r.adic=p.adicionais.map(a=>({nome:a.nome,preco:+a.preco||0}));
    if(p.escolha)r.esc={nomeSing:p.escolha.nomeSing||'item',nomePlural:p.escolha.nomePlural||'itens',max:+p.escolha.max||1,precos:p.escolha.precos||[],opcoes:p.escolha.opcoes.map(x=>x.nome)};
    return r});
  prods.sort((a,b)=>{const ia=ordem.indexOf(a.cat),ib=ordem.indexOf(b.cat);return (ia<0?99:ia)-(ib<0?99:ib)});
  const logo=S.config.logo&&S.config.logo.length<160000?S.config.logo:'';

function publicarCardapio(){

    publicarFotos();
    NV.db.collection('publico').doc('cardapio').set({j,delivery:!!o.delivery,mesas:!!o.mesas,_t:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>{NV.pubUlt=null;nvErro(e)});

function hashStr(t){let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))|0;return t.length+':'+(h>>>0).toString(36)}
async function publicarFotos(){
  if(NV.pubFotosRodando)return;NV.pubFotosRodando=true;
  const feitas=lsGet('bdb_pubfotos',{});let mud=false;
  try{for(const p of S.cardapio){
    if(!(p.foto&&p.foto.startsWith('data:')&&p.foto.length<950000))continue;
    const h=hashStr(p.foto);if(feitas[p.id]===h)continue;
    try{await NV.db.collection('publico').doc('f_'+p.id).set({d:p.foto});feitas[p.id]=h;mud=true}catch(e){nvErro(e);break}
  }}finally{if(mud)lsSet('bdb_pubfotos',feitas);NV.pubFotosRodando=false}
}

function tocarAviso(){
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [0,.18,.36].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=[880,1175,1568][i];g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.35,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.25);o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.3)})}catch(e){}

function pedById(id){return(NV.pedidos||[]).find(p=>p.id===id)}
async function aceitarPedido(id){
  const p=pedById(id);if(!p||p.status!=='novo'){toast('Esse pedido já foi atendido','amb');return}
  const linhas=[],faltando=[];
  for(const i of p.itens||[]){
    const pr=prodById(i.pid);if(!pr||pr.ativo===false){faltando.push(i.nome);continue}
    const sel=(i.sel||[]).filter(n=>Number.isInteger(n)&&n>=0&&n<(pr.adicionais||[]).length);
    const es=pr.escolha&&Array.isArray(i.esc)?pr.escolha.opcoes.map((_,k)=>Math.max(0,Math.min(+i.esc[k]||0,+pr.escolha.max||9))):null;
    const qtd=Math.max(1,Math.min(+i.qtd||1,50));
    linhas.push({pr,sel,es,qtd,obs:String(i.obs||'').slice(0,200)});
  }
  if(!linhas.length){toast('Nenhum produto desse pedido existe mais no cardápio','bad');return}
  if(faltando.length&&!await ask(`Estes itens não estão mais no cardápio e vão ficar de fora:\n• ${faltando.join('\n• ')}\n\nAceitar o resto?`,{ok:'Aceitar o resto'}))return;
  const bx=[];linhas.forEach(l=>baixasDe(l.pr,l.sel,l.es).forEach(b=>bx.push({itemId:b.itemId,qtd:b.qtd*l.qtd})));
  if(!await liberaSemEstoque(faltas(bx,1),'o pedido '+(p.tipo==='mesa'?'da mesa '+p.mesa:'de '+(p.nome||''))))return;
  let c;
  if(p.tipo==='mesa'){
    const n=+p.mesa;c=S.abertas.find(a=>a.tipo==='mesa'&&a.num===n);
    if(!c){c={id:uid(),tipo:'mesa',num:n,nome:'',nomeAuto:true,aberta:Date.now(),pessoas:[],itens:[],pagamentos:[],servico:S.config.taxa>0};S.abertas.push(c)}
  }else{
    const nums=S.abertas.filter(a=>a.tipo==='balcao').map(a=>a.num);let n=1;while(nums.includes(n))n++;
    c={id:uid(),tipo:'balcao',num:n,nome:(p.tipo==='retirada'?'🛍️ ':'🛵 ')+(p.nome||'Cliente'),aberta:Date.now(),pessoas:[],itens:[],pagamentos:[],servico:false,
      online:{pedidoId:id,tipo:p.tipo,fone:p.fone||'',endereco:p.endereco||'',ref:p.ref||'',pagamento:p.pagamento||'',troco:+p.troco||0,obs:p.obs||''}};
    S.abertas.push(c);
  }
  let pessoaId=null;
  if(p.tipo==='mesa'&&String(p.nome||'').trim()){
    const nm=String(p.nome).trim().slice(0,40),k=semAc(nm).toLowerCase();
    let ps=c.pessoas.find(x=>semAc(x.nome).toLowerCase()===k);
    if(!ps){ps={id:uid(),nome:nm};c.pessoas.push(ps)}
    pessoaId=ps.id;
    if(!c.nome||c.nomeAuto){const ns=c.pessoas.map(x=>x.nome);c.nome=ns.length===1?ns[0]:ns.length<=3?ns.slice(0,-1).join(', ')+' e '+ns[ns.length-1]:ns.slice(0,2).join(', ')+' e mais '+(ns.length-2);c.nomeAuto=true}
  }
  linhas.forEach(l=>lancar(c,l.pr,l.qtd,l.sel,pessoaId,l.obs,l.es));
  const o=onl();
  if(p.tipo==='delivery'&&+o.taxaEnt>0)c.itens.push({id:uid(),key:'taxa-entrega',prodId:null,nome:'🛵 Taxa de entrega',adic:[],preco:+o.taxaEnt,qtd:1,pessoaId:null,obs:'',custo:0,baixas:[],ts:Date.now(),por:nomeAtual()});
  if(p.tipo==='mesa'&&p.obs)c.itens[c.itens.length-1].obs=[c.itens[c.itens.length-1].obs,p.obs].filter(Boolean).join(' · ');
  registrar('pedido',`Aceitou pedido online ${p.tipo==='mesa'?'da mesa '+p.mesa:'de '+(p.nome||'')} (${linhas.length} item(ns))`,nomeAtual());
  save();
  const tot=calc(c).total;
  try{await NV.db.collection('pedidos').doc(id).update({status:'aceito',comandaId:c.id,aceitoPor:nomeAtual(),totalBar:r2(p.tipo==='mesa'?sum(c.itens.filter(i=>linhas.some(l=>l.pr.id===i.prodId)),i=>i.preco*i.qtd):tot),atualizado:firebase.firestore.FieldValue.serverTimestamp()})}
  catch(e){nvErro(e);toast('⚠️ Lançado aqui, mas não consegui avisar o cliente','amb')}
  toast(`✅ Pedido lançado em ${esc(labelC(c))}`);render();
}

    <label class="f">Ponto de referência<input value="${esc(f.ref||'')}" oninput="CL.f.ref=this.value"></label>`:''}
    <div style="margin:10px 0 4px"><b>Pagamento</b> <small class="mut">${ent?'na entrega':'na retirada'}</small></div>
    <div class="chips">${['Pix','Dinheiro','Cartão'].map(x=>`<button class="tg ${CL.pag===x?'on':''}" onclick="CL.pag='${x}';refresh()">${x==='Pix'?'⚡':x==='Dinheiro'?'💵':'💳'} ${x}</button>`).join('')}</div>
    ${CL.pag==='Dinheiro'?`<label class="f">Troco para quanto?<input type="number" value="${esc(f.troco||'')}" oninput="CL.f.troco=this.value" placeholder="Deixe vazio se não precisar"></label>`:''}
    ${CL.pag==='Pix'&&P.pix?`<p class="help">A chave Pix aparece depois que o bar aceitar o pedido.</p>`:''}
   </div>`:`<label class="f">Seu nome<input value="${esc(f.nome||'')}" oninput="CL.f.nome=this.value" autocomplete="given-name" placeholder="Assim seu pedido fica na sua conta"></label><p class="help" style="margin-top:-4px">Cada pessoa da mesa pode pedir com o próprio nome — na hora de pagar, a conta já sai separada.</p>`}
  <label class="f">Observação do pedido<input value="${esc(f.obs||'')}" maxlength="200" oninput="CL.f.obs=this.value"></label>
  <div class="tl"><span class="mut">Itens</span><span>${R(sub)}</span></div>${taxa?`<div class="tl"><span class="mut">Entrega</span><span>${R(taxa)}</span></div>`:''}
  <div class="tl big"><span>Total</span><span class="amb">${R(tot)}</span></div>
  ${dl&&P.minimo&&sub<P.minimo?`<p class="help" style="color:#ff8a8a">Pedido mínimo de ${R(P.minimo)} para delivery.</p>`:''}
  <div id="clErr" class="lg-err"></div>
  <div class="mf"><button class="btn" onclick="popModal()">Continuar escolhendo</button><button class="btn p" id="clEnv" ${CL.cart.length&&!(dl&&P.minimo&&sub<P.minimo)?'':'disabled'} onclick="clEnviar()">Enviar pedido 🚀</button></div>`;
}
async function clEnviar(){
  const P=CL.pub,f=CL.f||{},dl=CL.modo==='delivery',ent=dl&&CL.ent==='delivery',er=$('#clErr');
  if(!clAberto()){er.textContent='Os pedidos foram fechados agora há pouco.';return}
  if(dl&&(!String(f.nome||'').trim()||String(f.fone||'').replace(/\D/g,'').length<10)){er.textContent='Preencha seu nome e WhatsApp com DDD.';return}
  if(ent&&String(f.end||'').trim().length<6){er.textContent='Preencha o endereço com número.';return}
  const itens=CL.cart.map(i=>{const p=clProd(i.pid);return{pid:i.pid,nome:p?p.nome:'',qtd:i.qtd,sel:i.sel||[],esc:i.esc||null,obs:i.obs||'',detalhe:clDetalhe(i),preco:r2(clPrecoItem(i))}});
  const doc={tipo:CL.modo==='mesa'?'mesa':ent?'delivery':'retirada',mesa:CL.modo==='mesa'?CL.mesa:null,nome:String(f.nome||'').trim().slice(0,60),fone:String(f.fone||'').trim().slice(0,30),
    endereco:ent?String(f.end||'').trim().slice(0,200):'',ref:ent?String(f.ref||'').trim().slice(0,120):'',pagamento:dl?CL.pag:'',troco:dl&&CL.pag==='Dinheiro'&&+f.troco?+f.troco:0,
    obs:String(f.obs||'').trim().slice(0,200),itens,status:'novo',criado:firebase.firestore.FieldValue.serverTimestamp(),total:r2(clSub()+(ent?P.taxaEnt:0))};
  const b=$('#clEnv');b.disabled=true;b.textContent='Enviando…';
  try{const r=await NV.db.collection('pedidos').add(doc);CL.cart=[];CL.pedId=r.id;try{localStorage.setItem('bdb_cli_ped',r.id)}catch(e){}UI.modals=[];refresh();clAcompanhar(r.id)}
  catch(e){b.disabled=false;b.textContent='Enviar pedido 🚀';er.textContent=e&&e.code==='permission-denied'?'Os pedidos estão fechados agora.':'Não consegui enviar. Confira a internet e tente de novo.'}
}
function clAcompanhar(id){
  if(CL.un){try{CL.un()}catch(e){}}
  CL.un=NV.db.collection('pedidos').doc(id).onSnapshot(d=>{if(!d.exists){clNovo();return}CL.ped=d.data({serverTimestamps:'estimate'});clRenderPed()},()=>clNovo());
}
function clNovo(){if(CL.un){try{CL.un()}catch(e){}}CL.un=null;CL.pedId=null;CL.ped=null;try{localStorage.removeItem('bdb_cli_ped')}catch(e){}clRender()}
function clRenderPed(){
  const p=CL.ped,P=CL.pub;const st=p.status;
  const passos=p.tipo==='mesa'?[['novo','Enviado'],['aceito','Aceito']]:p.tipo==='retirada'?[['novo','Enviado'],['aceito','Preparando'],['entregue','Retirado']]:[['novo','Enviado'],['aceito','Preparando'],['saiu','Saiu para entrega'],['entregue','Entregue']];
  const idx=passos.findIndex(x=>x[0]===st);
  const msg={novo:'⏳ Esperando o bar confirmar…',aceito:p.tipo==='mesa'?'✅ Pedido aceito! Já já chega na sua mesa.':'👨‍🍳 Pedido aceito! Já está sendo preparado.',saiu:'🛵 Saiu para entrega! Fica de olho na porta.',entregue:'🍻 Pedido entregue. Bom apetite!',recusado:'😕 O bar não conseguiu aceitar seu pedido.'}[st]||st;
  const total=p.totalBar||p.total;
  clTela(`<header class="cl-hd"><img src="${P.logo||LOGO_BATISTA}" alt=""><div><h1>${esc(P.nome)}</h1><div class="cl-sub">${p.tipo==='mesa'?'Mesa '+p.mesa:p.tipo==='retirada'?'🛍️ Retirada':'🛵 Delivery'}</div></div></header>
  <main class="cl-lista"><div class="card cl-st-card"><div class="cl-msg ${st}">${msg}</div>
   ${st==='recusado'?(p.motivo?`<p>${esc(p.motivo)}</p>`:''):`<div class="cl-passos">${passos.map((x,i)=>`<div class="${i<=idx?'ok':''}"><span>${i<idx||st==='entregue'?'✓':i+1}</span>${x[1]}</div>`).join('')}</div>`}
   ${(st==='aceito'||st==='saiu')&&p.pagamento==='Pix'&&P.pix?`<div class="sec"><b>⚡ Chave Pix do bar</b><div class="onl-lk"><input readonly value="${esc(P.pix)}"><button class="btn s" onclick="copiar('${esc(P.pix)}')">Copiar</button></div><small class="mut">Valor: ${R(total)} — mande o comprovante pelo WhatsApp.</small></div>`:''}
   <div class="sec">${(p.itens||[]).map(i=>`<div class="tl"><span>${i.qtd}× ${esc(i.nome)}${i.detalhe?` <small class="mut">(${esc(i.detalhe)})</small>`:''}</span><span>${R(i.preco*i.qtd)}</span></div>`).join('')}<div class="tl big"><span>Total</span><span class="amb">${R(total)}</span></div></div>
   ${P.whats?`<a class="btn" style="width:100%;justify-content:center" target="_blank" rel="noopener" href="https://wa.me/55${P.whats.replace(/\D/g,'').replace(/^55/,'')}">💬 Falar com o bar no WhatsApp</a>`:''}
   ${['entregue','recusado','aceito'].includes(st)&&!(st==='aceito'&&p.tipo!=='mesa')?`<button class="btn p" style="width:100%;justify-content:center;margin-top:10px" onclick="clNovo()">${p.tipo==='mesa'?'Pedir mais alguma coisa 🍺':'Fazer outro pedido'}</button>`:''}
  </div></main>`);
}

window.__cli=CLIENTE;
/* ============ início ============ */
if(CLIENTE){S=blank();aplicarTema();clIniciar()}else{
S=load();
if(!S){seed();save()}else{S=normalizar(S);migrarCardapio()}
aplicarTema();
NV.ativo=lsGet(NV_K.con,null)===FB_CFG.projectId;
if(NV.ativo)nvSombraInit();
lembrarSite();
if(NV.ativo){nvStatus();iniciarSessao()}else nvTela('Conectando à nuvem…');
nvIniciar();
}
setInterval(()=>{if(UI.tab==='comandas'&&!UI.comandaId&&!UI.modals.length)render()},60000);
</script>
